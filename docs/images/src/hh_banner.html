<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Michroma;src:url(node_modules/@fontsource/michroma/files/michroma-latin-400-normal.woff2)}
@font-face{font-family:Plex;font-weight:500;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2)}
@font-face{font-family:Plex;font-weight:400;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1600px;height:600px;overflow:hidden;background:#070909}
.wrap{position:relative;width:1600px;height:600px;background:
  linear-gradient(rgba(111,240,180,.055) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(111,240,180,.055) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(rgba(111,240,180,.025) 1px,transparent 1px) 0 0/8px 8px,
  linear-gradient(90deg,rgba(111,240,180,.025) 1px,transparent 1px) 0 0/8px 8px,
  radial-gradient(ellipse at 20% 45%,#0f1a17,#070909 70%)}
.strip{position:absolute;left:0;right:0;top:0;height:46px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.05) 1px 3px),linear-gradient(180deg,#d9dde0,#a9afb3 60%,#8e9498);
  border-bottom:2px solid #050606;display:flex;align-items:center;justify-content:space-between;padding:0 40px;
  font:500 15px Plex;letter-spacing:.24em;color:#1b1f21}
.border{position:absolute;left:24px;right:24px;top:70px;bottom:24px;border:1.5px solid rgba(111,240,180,.45)}
.border:before{content:"";position:absolute;inset:6px;border:1px solid rgba(111,240,180,.18)}
.title{position:absolute;left:72px;top:118px}
.hh{font:400 30px Michroma;letter-spacing:.5em;color:#bdf7dc;text-shadow:0 0 14px rgba(111,240,180,.55)}
.unit{margin-top:16px;font:400 92px/1.02 Michroma;letter-spacing:.04em;color:#79e8bd;
  text-shadow:0 0 6px rgba(121,232,189,.9),0 0 28px rgba(111,240,180,.45),0 0 70px rgba(111,240,180,.25)}
.sub{margin-top:26px;font:500 17px/1.7 Plex;letter-spacing:.14em;color:#8fbfa9}
.draw{position:absolute;left:800px;top:96px;width:760px;height:330px}
.l{stroke:#79e8bd;fill:none;stroke-width:1.6}
.ld{stroke:#79e8bd;fill:none;stroke-width:1;opacity:.55}
.t{font:500 14px Plex;letter-spacing:.12em;fill:#9fdcc2}
.tb{font:400 15px Michroma;letter-spacing:.18em;fill:#bdf7dc}
.block{position:absolute;right:48px;bottom:48px;display:grid;grid-template-columns:repeat(4,auto);border:1.5px solid rgba(111,240,180,.5);
  font:400 13px/1.25 Plex;letter-spacing:.12em;color:#8fbfa9}
.block div{padding:10px 18px;border-left:1px solid rgba(111,240,180,.3)}
.block div:first-child{border-left:0}
.block b{display:block;font:500 15px Plex;letter-spacing:.1em;color:#c9f7e2;margin-top:4px}
</style></head><body><div class="wrap">
<div class="strip"><span>ECHOLIVITY · CLASSIC ECHO COLLECTION</span><span>SHEET 1 OF 1</span></div>
<div class="border"></div>

<div class="title">
  <div class="hh">H &amp; H</div>
  <div class="unit">ECHO<br>UNIT</div>
  <div class="sub">SLIDING REPLAY HEAD · FIXED RECORD HEAD<br>12 IN/S TAPE · SYNCHRONOUS MOTOR</div>
</div>

<svg class="draw" viewBox="0 0 760 330">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#79e8bd" stroke-width="1.6"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#79e8bd"/></marker>
  </defs>
  <!-- tape run -->
  <line x1="20" y1="196" x2="740" y2="196" class="l" stroke-width="3"/>
  <line x1="20" y1="204" x2="740" y2="204" class="ld"/>
  <path d="M 600 236 L 690 236" class="l" marker-end="url(#af)"/>
  <text x="645" y="262" text-anchor="middle" class="t">TAPE 12 IN/S</text>
  <!-- fixed record head -->
  <path d="M 70 196 L 70 150 Q 70 140 80 140 L 120 140 Q 130 140 130 150 L 130 196" class="l"/>
  <line x1="100" y1="196" x2="100" y2="182" class="l"/>
  <path d="M 62 214 L 138 214" class="ld"/><path d="M 70 214 l -8 10 M 86 214 l -8 10 M 102 214 l -8 10 M 118 214 l -8 10 M 134 214 l -8 10" class="ld"/>
  <text x="100" y="124" text-anchor="middle" class="tb">REC</text>
  <text x="100" y="246" text-anchor="middle" class="t">FIXED</text>
  <!-- sliding bar -->
  <rect x="230" y="66" width="480" height="16" class="l"/>
  <line x1="238" y1="74" x2="702" y2="74" class="ld" stroke-dasharray="6 6"/>
  <!-- replay head on its carriage -->
  <rect x="420" y="82" width="60" height="22" class="l"/>
  <path d="M 420 196 L 420 150 Q 420 140 430 140 L 470 140 Q 480 140 480 150 L 480 196" class="l"/>
  <line x1="436" y1="104" x2="436" y2="140" class="l"/><line x1="464" y1="104" x2="464" y2="140" class="l"/>
  <line x1="450" y1="196" x2="450" y2="182" class="l"/>
  <text x="450" y="46" text-anchor="middle" class="tb">REPLAY</text>
  <line x1="300" y1="122" x2="396" y2="122" class="l" marker-start="url(#af)"/>
  <line x1="504" y1="122" x2="600" y2="122" class="l" marker-end="url(#af)"/>
  <text x="640" y="127" class="t">SLIDES</text>
  <!-- delay dimension -->
  <line x1="100" y1="286" x2="100" y2="250" class="ld"/><line x1="450" y1="300" x2="450" y2="210" class="ld"/>
  <line x1="100" y1="290" x2="450" y2="290" class="l" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="275" y="316" text-anchor="middle" class="t">DELAY = DISTANCE ÷ SPEED</text>
  <!-- scale on the bar -->
  <g class="ld">
    <line x1="240" y1="56" x2="240" y2="66"/><line x1="320" y1="60" x2="320" y2="66"/><line x1="400" y1="60" x2="400" y2="66"/><line x1="480" y1="60" x2="480" y2="66"/><line x1="560" y1="60" x2="560" y2="66"/><line x1="640" y1="60" x2="640" y2="66"/><line x1="700" y1="56" x2="700" y2="66"/>
  </g>
  <text x="240" y="48" text-anchor="middle" class="t">60</text><text x="700" y="48" text-anchor="middle" class="t">600 MS</text>
</svg>

<div class="block">
  <div>SOURCE<b>SERVICE MANUAL M107</b></div>
  <div>DRAWING<b>C/AC20000 · ISSUE 7</b></div>
  <div>BUILT<b>1975–1978</b></div>
  <div>MODEL<b>MAX FOR LIVE · gen~</b></div>
</div>
</div></body></html>
